[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  external_node_modules = ["better-sqlite3"]
  included_files = ["data/services.json", "lib/**"]

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/api-config"
  status = 200

[[redirects]]
  from = "/api/availability/slots"
  to = "/.netlify/functions/api-availability-slots"
  status = 200

[[redirects]]
  from = "/api/address/search"
  to = "/.netlify/functions/api-address-search"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/api-bookings"
  status = 200
